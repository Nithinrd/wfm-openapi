openapi: 3.0.0

info:
  title: WFM Mobile API
  version: 1.0.0
  description: Mobile application authentication APIs

servers:
  - url: https://demo.wfmsoftwaresolutions.com/MobileAppAPIJWT

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:

  /users/login:
    post:
      summary: User login
      description: Login using email and password
      security: []   # 👈 login itself does NOT require bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - Email
                - Password
              properties:
                Email:
                  type: string
                  format: email
                  example: abc@dsubj.com
                Password:
                  type: string
                  format: password
                  example: ssjebh
      responses:
        '200':
          description: Login successful
        '401':
          description: Unauthorized
        '400':
          description: Bad request

  /status/current:
    get:
      summary: Get current status
      description: Returns current clock status
      security:
        - bearerAuth: []
      parameters:
        - name: ClockNumber
          in: query
          required: true
          schema:
            type: integer
            example: 425
      responses:
        '200':
          description: Current status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  ClockNumber:
                    type: integer
                  Status:
                    type: string
                  Shift:
                    type: string
                  Timesheet:
                    type: string
        '401':
          description: Unauthorized
